<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Activity Lab | Activity List</title>
    <link rel="stylesheet" href="style.css" />

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3828955115174115"
         crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="topper">
      <h1>Activity Lab</h1>
    </div>

    <div class="subtopper">
      <button class="MainB" onclick="location.href='/index.html'">Back</button>
      <button class="MainB" onclick="openInBlank()">Fullscreen</button>
    </div>

    <div class="ad-container" style="text-align: center; margin: 15px 0;">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-3828955115174115"
           data-ad-slot="1"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>
           (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    </div>

    <iframe class="gameplayer"></iframe>

    <script>
      const fullQuery = window.location.search.substring(1);
      const pageIframe = document.querySelector('.gameplayer');

      if (fullQuery) {
        pageIframe.src = decodeURIComponent(fullQuery);
      }

      function openInBlank() {
        const newWindow = window.open('about:blank', '_blank');

        if (newWindow) {
          const popupIframe = newWindow.document.createElement('iframe');
          popupIframe.src = decodeURIComponent(fullQuery);
          popupIframe.style.position = 'fixed';
          popupIframe.style.top = '0';
          popupIframe.style.left = '0';
          popupIframe.style.width = '100vw';
          popupIframe.style.height = '100vh';
          popupIframe.style.border = 'none';
          popupIframe.style.margin = '0';
          popupIframe.style.padding = '0';
          popupIframe.style.overflow = 'hidden';

          newWindow.document.title = 'Home - Classroom';

          newWindow.document.body.style.margin = '0';
          newWindow.document.body.appendChild(popupIframe);
        } else {
          alert("allow pop-ups man");
        }
      }
    </script>
  </body>
</html>
