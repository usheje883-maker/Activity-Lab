<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Activity Lab | Activity</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="topper">
      <h1>Activity Lab</h1>
    </div>

    <div class="subtopper">
      <button class="MainB" onclick="location.href='/index.html'">Back</button>
      <button class="MainB" onclick="makeFullscreen()">Fullscreen</button>
    </div>

    <iframe class="gameplayer" allowfullscreen></iframe>

    <script>
      const fullQuery = window.location.search.substring(1);
      const pageIframe = document.querySelector('.gameplayer');

      if (fullQuery) {
        pageIframe.src = decodeURIComponent(fullQuery);
      }

      function makeFullscreen() {
        if (pageIframe.requestFullscreen) {
          pageIframe.requestFullscreen();
        } else if (pageIframe.webkitRequestFullscreen)
          pageIframe.webkitRequestFullscreen();
        } else if (pageIframe.msRequestFullscreen)
          pageIframe.msRequestFullscreen();
        }
      }
    </script>
  </body>
</html>
