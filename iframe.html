<!DOCTYPE html>
<html>
  <head>
    <title>Activity Lab</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="topper">
      <h1>Activity Lab</h1>
    </div>

    <div class="subtopper">
      <button class="MainB">Back</button>
    	<button class="MainB">Fullscreen</button>
    </div>

<script>
async function CreateTemplate(name, link, image, sc) {
  const original = document.querySelector(".gametemplate");
  const clone = original.cloneNode(true);
  const holder = document.getElementById("gameholder");

  const gameName = clone.querySelector(".gamename");
  const gameImage = clone.querySelector(".gameimage");

  clone.classList.replace("gametemplate", "gameobject");

  gameName.textContent = name;
  gameImage.src = image;

  if (sc) {
    clone.classList.add(sc);
  }

  gameImage.onclick = function() {
    window.location.href = link;
  };

  holder.appendChild(clone);
}

async function LoadGames() {
  const apiURL = "https://api.github.com/repos/usheje883-maker/Activity-Lab/contents/Games";

  try {
    const response = await fetch(apiURL);
    const games = await response.json();

    for (const game of games) {
      if (game.type !== "dir") continue;

      const gamePath = game.path;

      const dataResponse = await fetch(
        `https://api.github.com/repos/usheje883-maker/Activity-Lab/contents/${gamePath}/data.txt`
      );

      if (!dataResponse.ok) continue;

      const data = await dataResponse.json();

      const text = atob(data.content);
      const lines = text.split(/\r?\n/);

      const name = lines[0]?.trim() || game.name;
      const category = lines[1]?.trim() || "misc";
      const image = lines[2]?.trim() || "https://media1.tenor.com/m/QeyFuBQrWyYAAAAd/irobot-i-robot.gif";

      const link = `iframe.html?${gamePath}/Files/index.html`;

      CreateTemplate(
        name,
        link,
        image,
        category
      );
    }
  } catch (error) {
    console.error("Failed to load games:", error);
  }
}

LoadGames();
</script>
  </body>
</html>
