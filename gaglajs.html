<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity Lab | Activity List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="topper">
      <h1>Activity Lab</h1>
      <p>V0.5</p>
    </div>

    <div class="subtopper">
      <button class="MainB" onclick="location.href='index.html'">All Games</button>
      <button class="MainB" onclick="location.href='tools.html'">Tools</button>
    </div>

    <div id="gameholder"></div>

    <script>
      const CDN_BASE = "https://cdn.jsdelivr.net/gh/usheje883-maker/Activity-Lab-Special@main/";

      function formatUrl(url) {
        if (!url) return "";

        if (url.includes("github.com")) {
          return url
            .replace("github.com", "cdn.jsdelivr.net/gh")
            .replace("/blob/main/", "@main/")
            .replace("/tree/main/", "@main/");
        }

        if (url.startsWith("http://") || url.startsWith("https://")) {
          return url;
        }

        const cleanPath = url.startsWith("/") ? url.slice(1) : url;
        return `${CDN_BASE}${cleanPath}`;
      }

      async function LoadGames() {
        const jsonUrl = `${CDN_BASE}files.json`;
        const gameholder = document.getElementById("gameholder");

        if (!gameholder) {
          console.error("Could not find #gameholder");
          return;
        }

        try {
          const response = await fetch(jsonUrl);

          if (!response.ok) {
            throw new Error(`Failed to fetch files.json: ${response.status}`);
          }

          const games = await response.json();
          gameholder.innerHTML = "";

          const fragment = document.createDocumentFragment();

          for (const game of games) {
            const name = game.name || "Unknown Game";
            const image = formatUrl(game.image || "");
            const rawGameLink = game.link || "";
            const executableLink = formatUrl(rawGameLink);

            const card = document.createElement(executableLink ? "a" : "div");
            card.className = "gameobject";

            if (executableLink) {
              card.href = `iframe.html?url=${encodeURIComponent(executableLink)}`;
            }

            const gameImage = document.createElement("img");
            gameImage.className = "gameimage";
            gameImage.src = image;
            gameImage.alt = name;

            gameImage.onerror = () => {
              console.warn(`Failed to load image at: ${image}`);
              gameImage.style.display = "none";
            };

            const gameName = document.createElement("h1");
            gameName.className = "gamename";
            gameName.textContent = name;

            card.appendChild(gameImage);
            card.appendChild(gameName);
            fragment.appendChild(card);
          }

          gameholder.appendChild(fragment);
        } catch (error) {
          console.error("Error loading games:", error);
          gameholder.innerHTML = "<p>Failed to load activity list.</p>";
        }
      }

      document.addEventListener("DOMContentLoaded", LoadGames);
    </script>
  </body>
</html>
