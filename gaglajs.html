<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity Lab | Activity List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="topper">
      <h1>Activity Lab</h1>
      <p>V0.5</p>
    </div>

    <div class="subtopper">
      <button class="MainB" onclick="location.href='index.html'">All Games</button>
      <button class="MainB" onclick="location.href='tools.html'">Tools</button>
    </div>

    <div id="gameholder"></div>

   <script>
    function loadGame() {
      const params = new URLSearchParams(window.location.search);
      let gameUrl = params.get("url");

      if (!gameUrl) {
        document.body.innerHTML = `<h2 class="error-message">No game URL provided.</h2>`;
        return;
      }

      gameUrl = decodeURIComponent(gameUrl);

      if (gameUrl.startsWith("https:/") && !gameUrl.startsWith("https://")) {
        gameUrl = gameUrl.replace("https:/", "https://");
      } else if (gameUrl.startsWith("http:/") && !gameUrl.startsWith("http://")) {
        gameUrl = gameUrl.replace("http:/", "http://");
      }

      const iframe = document.getElementById("gameFrame");
      iframe.src = gameUrl;
    }

    document.addEventListener("DOMContentLoaded", loadGame);
  </script>
  </body>
</html>
