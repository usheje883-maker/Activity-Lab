<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity Lab | Activity List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="topper">
      <h1>Activity Lab</h1>
      <p>V0.5</p>
    </div>

    <div class="subtopper">
      <button class="MainB" onclick="location.href='index.html'">All Games</button>
      <button class="MainB" onclick="location.href='tools.html'">Tools</button>
    </div>

    <div id="gameholder"></div>

<script>
  const fullQuery = decodeURIComponent(window.location.search.substring(1));
  const pageIframe = document.querySelector(".gameplayer");

  let gameUrl = "";

  if (fullQuery) {
    if (fullQuery.startsWith("http://") || fullQuery.startsWith("https://")) {
      gameUrl = fullQuery;
    } else {
      gameUrl =
        "https://cdn.jsdelivr.net/gh/usheje883-maker/Activity-Lab-Special@main/" +
        fullQuery;
    }

    pageIframe.src = gameUrl;
  }

  function openInBlank() {
    if (!gameUrl) return;

    const newWindow = window.open("about:blank", "_blank");

    if (newWindow) {
      newWindow.document.write(`
        <!DOCTYPE html>
        <html>
          <head>
            <title>Activity Lab</title>
            <style>
              html, body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: black;
              }

              iframe {
                width: 100%;
                height: 100%;
                border: none;
              }
            </style>
          </head>
          <body>
            <iframe src="${gameUrl}"></iframe>
          </body>
        </html>
      `);

      newWindow.document.close();
    } else {
      alert("Please allow pop-ups.");
    }
  }
</script>

  </body>
</html>
