<!DOCTYPE html>
<html>
  <head>
    <title>Activity Lab</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="topper">
      <h1>Activity Lab</h1>
    </div>

<div class="subtopper">
  <button class="MainB" onclick="CreateTemplate('Yippy!', 'mainframe.html', 'https://media1.tenor.com/m/_zWYqfZdneIAAAAC/shocked-face-shocked-meme.gif')">All Games</button>
  <button class="MainB">Flash</button>
  <button class="MainB">Library</button>
  <button class="MainB">Emulated</button>
  <button class="MainB">Misc</button>
</div>

<div class="gametemplate">
  <img class="gameimage" src="https://media1.tenor.com/m/QeyFuBQrWyYAAAAd/irobot-i-robot.gif">
  <h1 class="gamename">Game Name</h1>
</div>

<div id="gameholder"></div>

<script>
  function CreateTemplate(name, link, image) {
    const original = document.querySelector(".gametemplate");
    const clone = original.cloneNode(true);
    const holder = document.getElementById("gameholder");

    const gameName = clone.querySelector(".gamename");
    const gameImage = clone.querySelector(".gameimage");

    clone.classList.replace("gametemplate", "gameobject");

    gameName.textContent = name;
    gameImage.src = image;

    gameImage.onclick = function() {
      window.location.href = link;
    };

    holder.appendChild(clone);
  }

  CreateTemplate(
    "Game Name",
    "iframe.html/Games/1/Files/index.html",
    "https://media1.tenor.com/m/QeyFuBQrWyYAAAAd/irobot-i-robot.gif"
  );
</script>
  </body>
</html>
