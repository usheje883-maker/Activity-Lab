<!DOCTYPE html>
<html>
	<head>
		<title>Activity Lab | Activity List</title>
		<link rel="stylesheet" href="style.css" />
		<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3828955115174115"
		 crossorigin="anonymous"></script>
	</head>
	<body>
		<div class="topper">
			<h1>Activity Lab</h1>
			<p1>V0.5</p1>
		</div>

		<div class="subtopper">
			<button class="MainB" onclick="location.href='/tools.html'">Tools</button>
		</div>

		<div class="subtopper">
			<button class="MainB" onclick="filterByGenre('')">All</button>
			<button class="MainB" onclick="filterByGenre('FNF')">FNF</button>
			<button class="MainB" onclick="filterByGenre('Car')">Car</button>
			<button class="MainB" onclick="filterByGenre('Gun')">Gun</button>
			<button class="MainB" onclick="filterByGenre('Survival')">Survival</button>
			<button class="MainB" onclick="filterByGenre('Simulator')">Simulator</button>
			<button class="MainB" onclick="filterByGenre('Multiplayer')">Multiplayer</button>
			<button class="MainB" onclick="filterByGenre('Idle game')">Idle Game</button>
		</div>

		<div class="gametemplate">
			<img class="gameimage" src="https://media1.tenor.com/m/QeyFuBQrWyYAAAAd/irobot-i-robot.gif">
				<h1 class="gamename">Game Name</h1>
			</div>

		<div id="gameholder"></div>

		<div class="ad-container">
			<ins class="adsbygoogle"
				 style="display:block;width:100%;min-height:100px"
				 data-ad-client="ca-pub-3828955115174115"
				 data-ad-slot="6757958925"
				 data-ad-format="auto"
				 data-full-width-responsive="true"></ins>
		</div>

		<script>
			window.addEventListener("DOMContentLoaded", function () {
				(adsbygoogle = window.adsbygoogle || []).push({});
			});
		</script>

		<script>
			let allGames = [];

			function renderGames(games) {
				const gameholder = document.getElementById("gameholder");
				gameholder.innerHTML = "";

				for (const game of games) {
					const name = game.name || "Unknown Game";
					const image = game.image || "";
					const link = game.link || "";

					const template = document.createElement("div");
					template.className = "gameobject";

					const gameImage = document.createElement("img");
					gameImage.className = "gameimage";
					gameImage.src = image;
					gameImage.alt = name;

					const gameName = document.createElement("h1");
					gameName.className = "gamename";
					gameName.textContent = name;

					template.appendChild(gameImage);
					template.appendChild(gameName);

					if (link) {
						template.style.cursor = "pointer";
						template.addEventListener("click", function () {
							window.location.href = `iframe.html?${encodeURIComponent(link)}`;
						});
					}

					gameholder.appendChild(template);
				}
			}

			function filterByGenre(genre) {
				if (!genre) {
					renderGames(allGames);
				} else {
					const filtered = allGames.filter(g => g.genre && g.genre.toLowerCase() === genre.toLowerCase());
					renderGames(filtered);
				}
			}

			async function LoadGames() {
				const jsonUrl = "https://raw.githubusercontent.com/usheje883-maker/Activity-Lab/main/games.json";
				const gameholder = document.getElementById("gameholder");

				if (!gameholder) {
					console.error("Could not find #gameholder");
					return;
				}

				try {
					const response = await fetch(jsonUrl);

					if (!response.ok) {
						throw new Error(`Failed to fetch games.json: ${response.status}`);
					}

					allGames = await response.json();
					renderGames(allGames);

				} catch (error) {
					console.error("Error loading games:", error);
				}
			}

			document.addEventListener("DOMContentLoaded", LoadGames);
		</script>

	</body>
</html>
