<!DOCTYPE html>
<html>
  <head>
    <title>Activity Lab | Activity List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="topper">
      <h1>Activity Lab</h1>
    </div>

    <div class="subtopper">
      <button class="MainB" onclick="location.href='/index.html'">All Games</button>
      <button class="MainB" onclick="location.href='/tools.html'">Tools</button>
    </div>

    <div class="gametemplate">
      <img class="gameimage" src="https://media1.tenor.com/m/QeyFuBQrWyYAAAAd/irobot-i-robot.gif">
      <h1 class="gamename">Game Name</h1>
    </div>
    
    <div id="gameholder"></div>
        <div class="gameobject">
      <img class="gameimage" src="Storage/gs.png" onclick="location.href='https://docs.google.com/forms/d/e/1FAIpQLSd8HM7-E0vftKd_N-IbGhE73oC8H6h_2msHxqAIw4Oq6gtGZQ/viewform?usp=dialog'">
      <h1 class="gamename">Suggest a game</h1>
    </div>
    <script>
async function LoadGames() {
    const repo = "usheje883-maker/Activity-Lab";
    const gameholder = document.getElementById("gameholder");

    if (!gameholder) {
        console.error("Could not find #gameholder");
        return;
    }

    try {
        const response = await fetch(
            `https://data.jsdelivr.com/v1/packages/gh/${repo}@main?structure=flat`
        );

        if (!response.ok) {
            throw new Error(`jsDelivr API error: ${response.status}`);
        }

        const data = await response.json();

        const gameDataFiles = data.files.filter(
            file => file.name.startsWith('/Games/') && file.name.endsWith('/data.txt')
        );

        gameholder.innerHTML = "";

        for (const file of gameDataFiles) {
            const pathParts = file.name.split('/');
            const gameFolder = pathParts[2];

            try {
                const txtResponse = await fetch(
                    `https://cdn.jsdelivr.net/gh/${repo}@main${file.name}`
                );

                if (!txtResponse.ok) continue;

                const textData = await txtResponse.text();
                const lines = textData
                    .split(/\r?\n/)
                    .map(line => line.trim())
                    .filter(line => line.length > 0);

                const name = lines[0] || gameFolder;
                const image = lines[1] || "";
                const link = lines[2] || "";

                const template = document.createElement("div");
                template.className = "gameobject";

                const gameImage = document.createElement("img");
                gameImage.className = "gameimage";
                gameImage.src = image;
                gameImage.alt = name;

                const gameName = document.createElement("h1");
                gameName.className = "gamename";
                gameName.textContent = name;

                template.appendChild(gameImage);
                template.appendChild(gameName);

                if (link) {
                    template.style.cursor = "pointer";
                    template.addEventListener("click", function () {
                        window.location.href = `iframe.html?${encodeURIComponent(link)}`;
                    });
                }

                gameholder.appendChild(template);

            } catch (error) {
                console.error(`Error loading game "${gameFolder}":`, error);
            }
        }

    } catch (error) {
        console.error("Error loading games via jsDelivr:", error);
    }
}

document.addEventListener("DOMContentLoaded", LoadGames);
</script>
    
  </body>
</html>
