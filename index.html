<!DOCTYPE html>
<html>
  <head>
    <title>Activity Lab</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="topper">
      <h1>Activity Lab</h1>
    </div>

    <div class="subtopper">
      <button class="MainB">All Games</button>
      <button class="MainB" onclick="location.href='/tools.html'">Tools</button>
    </div>

    <div class="gametemplate">
      <img class="gameimage" src="https://media1.tenor.com/m/QeyFuBQrWyYAAAAd/irobot-i-robot.gif">
      <h1 class="gamename">Game Name</h1>
    </div>
    
    <div id="gameholder"></div>
    <script>
async function LoadGames() {
    const repo = "usheje883-maker/Activity-Lab";
    const gamesPath = "Games";
    const gameholder = document.getElementById("gameholder");

    if (!gameholder) {
        console.error("Could not find #gameholder");
        return;
    }

    try {
        const response = await fetch(
            `https://api.github.com/repos/${repo}/contents/${gamesPath}`
        );

        if (!response.ok) {
            throw new Error(`GitHub API error: ${response.status}`);
        }

        const items = await response.json();
        gameholder.innerHTML = "";

        for (const item of items) {
            if (item.type !== "dir") {
                continue;
            }

            const gameFolder = item.name;

            try {
                const dataResponse = await fetch(
                    `https://api.github.com/repos/${repo}/contents/${gamesPath}/${encodeURIComponent(gameFolder)}/data.txt`
                );

                if (!dataResponse.ok) {
                    console.warn(
                        `Skipping ${gameFolder}: data.txt not found (Status: ${dataResponse.status})`
                    );
                    continue;
                }

                const dataFile = await dataResponse.json();

                if (!dataFile.content) {
                    console.warn(
                        `Skipping ${gameFolder}: data.txt is empty`
                    );
                    continue;
                }

                const data = atob(
                    dataFile.content.replace(/\n/g, "")
                );

                const lines = data
                    .split(/\r?\n/)
                    .map(line => line.trim())
                    .filter(line => line.length > 0);

                const name = lines[0] || gameFolder;
                const image = lines[1] || "";
                const link = lines[2] || "";

                console.log(`Loaded game: "${name}"`);
                console.log(`Game path: "${link}"`);

                const template = document.createElement("div");
                template.className = "gameobject";

                const gameImage = document.createElement("img");
                gameImage.className = "gameimage";
                gameImage.src = image;
                gameImage.alt = name;

                const gameName = document.createElement("h1");
                gameName.className = "gamename";
                gameName.textContent = name;

                template.appendChild(gameImage);
                template.appendChild(gameName);

                if (link) {
                    template.style.cursor = "pointer";

                    template.addEventListener("click", function () {
                        window.location.href =
                            `iframe.html?${encodeURIComponent(link)}`;
                    });
                }

                gameholder.appendChild(template);

            } catch (error) {
                console.error(
                    `Error loading game "${gameFolder}":`,
                    error
                );
            }
        }

    } catch (error) {
        console.error("Error loading games:", error);
    }
}

document.addEventListener("DOMContentLoaded", LoadGames);
</script>
    
  </body>
</html>
