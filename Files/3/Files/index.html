<style>

    body { 
        margin: 0; 
        min-height: 100vh; 
        display: flex; 
        flex-direction: column;
        justify-content: center; 
        align-items: center; 
        gap: 30px; 
        background-color: #181818; 
        font-family: sans-serif;
    }
    
    h1 { 
        color: white; 
        margin: 0;
        text-align: center;
     } 


	button{
	    width: 30vh;
	    height: 10vh;
	    background-color: #333333;
	    border: solid;
	    border-radius: 10px;
		font-size: 30px;
		color: white;
		cursor: pointer;
		font-weight: bold;
		border-color: #111111;
		
		transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s ease;
	}
	
    button:hover {
        transform: scale(1.15);
        background-color: #444444;
    }
</style>

<h1>Among Us</h1>

<button onclick="openAboutBlank('/Files/3/Files/Amongusold/index.html')">Among Us (Old)</button>

<button onclick="openAboutBlank('/Files/3/Files/Amongusnew/index.html')">Among Us (New)</button>

<script>
function openAboutBlank(url) {
    let newWindow = window.open('about:blank', '_blank');

    let docContent = `
        <!DOCTYPE html>
        <html>
        <head>
            <title>New Tab</title>
            <style>
                body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
                iframe { width: 100%; height: 100%; border: none; }
            </style>
        </head>
        <body>
            <iframe src="${url}"></iframe>
        </body>
        </html>
    `;

    newWindow.document.open();
    newWindow.document.write(docContent);
    newWindow.document.close();
}
</script>
