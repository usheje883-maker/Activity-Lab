<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Activity Lab | Activity List</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="topper">
      <h1>Activity Lab</h1>
    </div>

<div class="subtopper">
  <button class="MainB" onclick="location.href='/gaglajs.html'">Back</button>
  <button class="MainB" onclick="openInBlank()">Fullscreen</button>
</div>

<iframe class="gameplayer"></iframe>

<script>
  const gamePath = decodeURIComponent(window.location.search.substring(1));
  const pageIframe = document.querySelector(".gameplayer");

  if (gamePath) {
    const gameUrl =
      "https://cdn.jsdelivr.net/gh/usheje883-maker/Activity-Lab-Special@main/" +
      gamePath;

    pageIframe.src = gameUrl;
  }

  function openInBlank() {
    if (!gamePath) return;

    const gameUrl =
      "https://cdn.jsdelivr.net/gh/usheje883-maker/Activity-Lab-Special@main/" +
      gamePath;

    const newWindow = window.open("about:blank", "_blank");

    if (newWindow) {
      newWindow.document.write(`
        <!DOCTYPE html>
        <html>
          <head>
            <title>Home - Classroom</title>
            <style>
              html, body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: black;
              }

              iframe {
                width: 100%;
                height: 100%;
                border: none;
              }
            </style>
          </head>

          <body>
            <iframe src="${gameUrl}"></iframe>
          </body>
        </html>
      `);

      newWindow.document.close();
    } else {
      alert("Please allow pop-ups.");
    }
  }
</script>
  </body>
</html>
